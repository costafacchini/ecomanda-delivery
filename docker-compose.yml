services:
  mongo:
    image: mongo
    restart: always
    env_file:
      - .env.docker
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - 27018:27017
    volumes:
      - mongo_data:/var/lib/mongodb/data
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

  mongo-express:
    image: mongo-express
    ports:
      - 8181:8081
    env_file:
      - .env.docker
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_ROOT_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=admin
    links:
      - "mongo"

  redis:
    image: redis:6
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/var/lib/redis/data

  app:
    build: .
    ports:
      - "5100:5000"
    depends_on:
      - mongo
      - redis
    env_file:
      - .env.docker
      - .env
    environment:
      NODE_ENV: production
      PORT: "5000"
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=admin
      REDIS_URL: redis://redis:6379
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: /app/uploads
      APP_URL: http://localhost:5100
      ENABLE_BAILEYS_SOCKET: "false"
    volumes:
      - uploads:/app/uploads

volumes:
  mongo_data:
  redis_data:
  uploads:
